# mux observability stack: OpenTelemetry Collector, Prometheus, Tempo, Loki, and Grafana, provisioned with
# the mux dashboards (assets/grafana). mux itself runs on the host (`mux serve`, the tray agent, or the
# desktop app), not in a container: it pushes OTLP to the collector published on 127.0.0.1:4317/4318, and
# Prometheus can also scrape a mux process's in-process endpoint through host.docker.internal:9464.
#
#   docker compose -f docker/compose.yaml up -d
#   MUX_OBSERVABILITY_ENABLED=true mux serve        # or set "observability": { "enabled": true }
#   open http://localhost:3000                       # Grafana (admin / admin locally; see below)
#
# Host ports default to the standard ones and can be moved when they collide with another stack:
# MUX_GRAFANA_PORT (3000), MUX_PROMETHEUS_PORT (9090), MUX_TEMPO_PORT (3200), MUX_LOKI_PORT (3100),
# MUX_OTLP_GRPC_PORT (4317), MUX_OTLP_HTTP_PORT (4318), MUX_COLLECTOR_METRICS_PORT (8889). If you move the
# OTLP port, point mux at it too (MUX_OTLP_ENDPOINT=http://127.0.0.1:<port>).
#
# Images are pinned. Change GF_SECURITY_ADMIN_PASSWORD (via the environment, never in this file) for any
# deployment that is not a single developer machine. Prometheus, Tempo, Loki, and the collector have no
# authentication; their ports are bound to 127.0.0.1 only. See TELEMETRY.md.

name: 'mux-observability'

services:

  tempo:
    container_name: 'mux-tempo'
    # Pinned: later Tempo builds reject the standard ingester/compactor config used here.
    image: 'grafana/tempo:2.6.1'
    command: ['-config.file=/etc/tempo.yaml']
    ports:
      - '127.0.0.1:${MUX_TEMPO_PORT:-3200}:3200'
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - mux-tempo-data:/var/tempo
    healthcheck:
      # The tempo image ships wget (not curl); /ready returns 503 until ready, then 200.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3200/ready || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 40s

  loki:
    container_name: 'mux-loki'
    image: 'grafana/loki:3.2.1'
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '127.0.0.1:${MUX_LOKI_PORT:-3100}:3100'
    volumes:
      - mux-loki-data:/loki
    healthcheck:
      # The loki image ships wget (not curl); /ready returns 200 once the ring is up.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

  otel-collector:
    container_name: 'mux-otel-collector'
    image: 'otel/opentelemetry-collector-contrib:0.109.0'
    command: ['--config=/etc/otel-collector.yaml']
    ports:
      - '127.0.0.1:${MUX_OTLP_GRPC_PORT:-4317}:4317'   # OTLP gRPC (mux default)
      - '127.0.0.1:${MUX_OTLP_HTTP_PORT:-4318}:4318'   # OTLP HTTP
      - '127.0.0.1:${MUX_COLLECTOR_METRICS_PORT:-8889}:8889'   # Prometheus exporter (scraped by Prometheus)
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    # The collector image is distroless (no shell, curl, or wget), so it cannot run an in-container probe.
    # Prometheus' "otel-collector" scrape target (up == 1) is its liveness signal; dependents use service_started.

  prometheus:
    container_name: 'mux-prometheus'
    image: 'prom/prometheus:v3.5.4'
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--enable-feature=exemplar-storage'
    ports:
      - '127.0.0.1:${MUX_PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus-alerts.yaml:/etc/prometheus/prometheus-alerts.yaml:ro
      - mux-prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      # The prometheus image ships wget (not curl); /-/healthy returns 200 when ready.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 20s

  grafana:
    container_name: 'mux-grafana'
    image: 'grafana/grafana-oss:13.0.2'
    ports:
      - '127.0.0.1:${MUX_GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: '${GF_SECURITY_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GF_SECURITY_ADMIN_PASSWORD:-admin}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - mux-grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../assets/grafana:/var/lib/grafana/dashboards/mux:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

volumes:
  mux-tempo-data:
  mux-loki-data:
  mux-prometheus-data:
  mux-grafana-data:
