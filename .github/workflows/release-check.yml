name: release-check

# Runs the release workflow as a dry run on all three runners: every channel builds with the real tools
# (pkgbuild, hdiutil, appimagetool, fpm, Inno Setup, ...) and every installer is installed and run, but no
# secrets are passed and nothing is published (release.yml publishes only for a pushed v* tag). It runs on
# pushes to main that change the packaging code, manifest, or other packaging inputs.

on:
  push:
    branches: [main]
    paths:
      - 'src/Mux.Publisher/**'
      - 'publisher.json'
      - 'assets/**'
      - 'LICENSE.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-check.yml'
      - '.github/release-install-notes.md'
      - '.github/scripts/**'

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/release.yml
