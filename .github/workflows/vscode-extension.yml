name: vscode-extension

# Builds and checks the VS Code extension on every relevant push and pull request. Publishing is manual:
# run this workflow from the Actions tab with "publish" checked to push the extension to the VS Code
# Marketplace and Open VSX and attach a checksummed .vsix to the vscode-v<version> GitHub Release. The two
# marketplace tokens (VSCE_PAT, OVSX_PAT) are the only human-provided inputs.

on:
  push:
    branches: [main]
    paths: ['src/Mux.VSCode/**', '.github/workflows/vscode-extension.yml']
  pull_request:
    paths: ['src/Mux.VSCode/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the VS Code Marketplace and Open VSX'
        type: boolean
        default: false

defaults:
  run:
    working-directory: src/Mux.VSCode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: i18n check
        run: npm run i18n
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
      - name: Package VSIX
        run: |
          npx --yes @vscode/vsce package --out mux.vsix
          sha256sum mux.vsix > mux.vsix.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            src/Mux.VSCode/mux.vsix
            src/Mux.VSCode/mux.vsix.sha256

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Read the extension version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package VSIX
        run: |
          npx --yes @vscode/vsce package --out mux.vsix
          sha256sum mux.vsix > mux.vsix.sha256
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath mux.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx --yes ovsx publish mux.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vscode-v${{ steps.version.outputs.version }}
          files: |
            src/Mux.VSCode/mux.vsix
            src/Mux.VSCode/mux.vsix.sha256
