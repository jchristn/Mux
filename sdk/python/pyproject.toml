[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mux-sdk"
version = "0.7.0"
description = "Thin Python driver for the mux CLI: spawns `mux print --output-format jsonl` and returns typed results."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mux", "ai", "agent", "cli", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
include = ["mux_sdk*"]
